services:
  postgres:
    image: postgres:16-alpine
    container_name: team-mex-mtto-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: team_mex
      POSTGRES_PASSWORD: team_mex
      POSTGRES_DB: team_mex_mtto
    ports:
      # Solo en esta máquina (desarrollo local). No se publica a la LAN.
      - '127.0.0.1:5432:5432'
    volumes:
      - team_mex_pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U team_mex -d team_mex_mtto']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: [app]
    build:
      context: ./api
    container_name: team-mex-mtto-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: team_mex
      DB_PASSWORD: team_mex
      DB_NAME: team_mex_mtto
      HOST: 0.0.0.0
      PORT: 3001
      CORS_ORIGIN: '*'
    ports:
      - '3001:3001'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3001/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  web:
    profiles: [app]
    build:
      context: ./web
      args:
        API_URL: http://api:3001
    container_name: team-mex-mtto-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - '3000:3000'

volumes:
  team_mex_pgdata:
