<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Referencia — Inicio Supervisor</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #17233e;
        --muted: #667085;
        --line: #d9dfe8;
        --paper: #f7f6f2;
        --surface: #ffffff;
        --orange: #aa400d;
        --orange-dark: #a94316;
        --warning: #a65b05;
        --warning-soft: #fff2dd;
        --danger: #b42318;
        --danger-soft: #fff0ee;
        --blue: #245da6;
        --blue-soft: #edf5ff;
        --shadow: 0 8px 24px rgba(23, 35, 62, 0.08);
      }

      * { box-sizing: border-box; }
      html { background: #e7e9ed; }
      body {
        margin: 0;
        min-width: 320px;
        background: var(--paper);
        color: var(--ink);
        font-family: Aptos, "Segoe UI Variable", "Segoe UI", ui-sans-serif, system-ui, sans-serif;
        font-size: 15px;
        line-height: 1.45;
      }
      button { font: inherit; }
      .phone {
        min-height: 100dvh;
        margin: 0 auto;
        max-width: 440px;
        background: var(--paper);
      }
      .topbar {
        display: flex;
        min-height: 68px;
        align-items: center;
        justify-content: space-between;
        padding: 14px 20px 10px;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
      }
      .brand { display: flex; align-items: center; gap: 10px; font-weight: 750; letter-spacing: -0.02em; }
      .brand-mark {
        display: grid; width: 32px; height: 32px; place-items: center;
        color: white; background: var(--ink); border-radius: 9px;
      }
      .icon-button {
        display: grid; width: 44px; height: 44px; place-items: center;
        position: relative; border: 0; border-radius: 10px; color: var(--ink); background: transparent;
      }
      .notification-dot { position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border: 2px solid white; border-radius: 50%; background: var(--orange); }
      main { padding: 28px 16px 98px; }
      h1 { margin: 0; font-size: 27px; line-height: 1.1; letter-spacing: -0.04em; }
      .lede { margin: 8px 0 28px; color: var(--muted); }
      .section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 0 4px 10px; }
      h2 { margin: 0; font-size: 15px; letter-spacing: -0.01em; }
      .quiet-link { color: var(--blue); font-size: 14px; font-weight: 650; text-decoration: none; }
      .attention-list { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface); box-shadow: var(--shadow); }
      .attention {
        display: grid; grid-template-columns: 34px minmax(0, 1fr) 18px; align-items: center; gap: 12px;
        width: 100%; min-height: 80px; padding: 13px 14px; text-align: left;
        color: inherit; background: var(--surface); border: 0; border-bottom: 1px solid var(--line); cursor: pointer;
      }
      .attention:last-child { border-bottom: 0; }
      .attention:focus-visible, .order-link:focus-visible, .nav-item:focus-visible, .icon-button:focus-visible { outline: 3px solid #7aa6e5; outline-offset: -3px; }
      .attention:hover { background: #fbfcfe; }
      .source {
        display: grid; width: 34px; height: 34px; place-items: center; border-radius: 10px;
      }
      .source.warning { color: var(--warning); background: var(--warning-soft); }
      .source.danger { color: var(--danger); background: var(--danger-soft); }
      .source.info { color: var(--blue); background: var(--blue-soft); }
      .attention-copy { min-width: 0; }
      .attention-title { display: block; font-weight: 720; letter-spacing: -0.01em; }
      .attention-detail { display: block; margin-top: 2px; overflow: hidden; color: var(--muted); font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
      .arrow { color: var(--muted); }
      .orders { margin-top: 28px; }
      .order-link {
        display: flex; min-height: 68px; align-items: center; justify-content: space-between; gap: 16px;
        padding: 13px 14px 13px 16px; color: var(--ink); text-decoration: none;
        background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
      }
      .order-link:hover { border-color: #b6c0d1; }
      .order-label { display: block; color: var(--muted); font-size: 13px; }
      .order-count { display: block; margin-top: 1px; font-size: 17px; font-weight: 750; letter-spacing: -0.02em; }
      .continue { flex: none; padding: 8px 11px; border-radius: 8px; color: white; background: var(--orange); font-size: 13px; font-weight: 700; }
      .footnote { margin: 15px 4px 0; color: var(--muted); font-size: 13px; }
      .bottom-nav {
        position: fixed; right: 0; bottom: 0; left: 0; z-index: 2; display: grid; grid-template-columns: repeat(4, 1fr);
        max-width: 440px; min-height: 72px; margin: auto; padding-bottom: env(safe-area-inset-bottom);
        background: rgba(255, 255, 255, .97); border-top: 1px solid var(--line); box-shadow: 0 -6px 20px rgba(23, 35, 62, .06);
      }
      .nav-item { display: grid; min-height: 58px; place-content: center; gap: 3px; color: var(--muted); text-align: center; text-decoration: none; font-size: 11px; font-weight: 620; }
      .nav-item.active { color: var(--ink); }
      .nav-icon { display: block; margin: auto; }
      @media (min-width: 560px) {
        body { padding: 20px 0; }
        .phone { min-height: calc(100dvh - 40px); overflow: hidden; }
        .bottom-nav { right: auto; left: 50%; width: min(440px, 100%); transform: translateX(-50%); }
      }
    </style>
  </head>
  <body>
    <div class="phone">
      <header class="topbar">
        <div class="brand"><span class="brand-mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 15.5 12 4l8 11.5"/><path d="M6.5 14h11"/></svg></span>TeamMex</div>
        <button class="icon-button" aria-label="Abrir alertas"><span class="notification-dot"></span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg></button>
      </header>

      <main>
        <h1>Qué hay que revisar</h1>
        <p class="lede">Estas condiciones siguen abiertas. Toca una para revisar el siguiente paso.</p>

        <section aria-labelledby="alertas-title">
          <div class="section-head"><h2 id="alertas-title">Alertas abiertas</h2><a class="quiet-link" href="#alertas">Ver todas</a></div>
          <div class="attention-list" id="alertas">
            <button class="attention" type="button">
              <span class="source warning" aria-hidden="true"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 4.9 2.8 18a2 2 0 0 0 1.7 3h15a2 2 0 0 0 1.7-3L13.7 4.9a2 2 0 0 0-3.4 0Z"/></svg></span>
              <span class="attention-copy"><span class="attention-title">Mantenimiento vencido</span><span class="attention-detail">FOTON 2023 · 30 días sin visita cerrada</span></span>
              <span class="arrow" aria-hidden="true">›</span>
            </button>
            <button class="attention" type="button">
              <span class="source danger" aria-hidden="true"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 5h14v14H5z"/><path d="M8 9h8M8 13h5"/></svg></span>
              <span class="attention-copy"><span class="attention-title">Stock bajo</span><span class="attention-detail">Filtro de aceite · 2 piezas · mínimo 5</span></span>
              <span class="arrow" aria-hidden="true">›</span>
            </button>
            <button class="attention" type="button">
              <span class="source info" aria-hidden="true"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z"/><path d="M12 7v5l3 2"/></svg></span>
              <span class="attention-copy"><span class="attention-title">Salud crítica</span><span class="attention-detail">DUCATO 2021 · Health 39%</span></span>
              <span class="arrow" aria-hidden="true">›</span>
            </button>
          </div>
        </section>

        <section class="orders" aria-labelledby="ordenes-title">
          <div class="section-head"><h2 id="ordenes-title">Órdenes</h2></div>
          <a class="order-link" href="#ordenes"><span><span class="order-label">Órdenes abiertas</span><span class="order-count">3 borradores por continuar</span></span><span class="continue">Ver órdenes</span></a>
          <p class="footnote">Las órdenes se trabajan en su propio panel.</p>
        </section>
      </main>

      <nav class="bottom-nav" aria-label="Navegación principal">
        <a class="nav-item active" href="#inicio" aria-current="page"><svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/><path d="M9 21v-6h6v6"/></svg>Inicio</a>
        <a class="nav-item" href="#ordenes"><svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5h6M9 9h6M9 13h4"/><path d="M5 3h14v18H5z"/></svg>Órdenes</a>
        <a class="nav-item" href="#unidades"><svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11h18v7H3z"/><path d="M6 18v2M18 18v2M7 11V7h10v4"/></svg>Unidades</a>
        <a class="nav-item" href="#inventario"><svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16v13H4z"/><path d="M7 7V4h10v3M8 12h8"/></svg>Inventario</a>
      </nav>
    </div>
  </body>
</html>
